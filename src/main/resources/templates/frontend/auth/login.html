<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">

<head>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      
<meta charset="UTF-8">
<title>會員登入</title>

<link rel="stylesheet" th:href="@{/css/index/header.css}">
<link rel="stylesheet" th:href="@{/css/index/footer.css}">

<style>
body {
    margin: 0;
    background: #f6f7fb;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

.btn-demo-login {
    width: 100%;
    padding: 12px;
    border: 1px solid #ff7a00;
    border-radius: 8px;
    background: #fff;
    color: #ff7a00;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
}

.btn-demo-login:hover {
    background: #fff3e6;
}

.login-wrapper {
    min-height: 620px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
}

.login-card {
    width: 420px;
    background: #fff;
    border-radius: 14px;
    padding: 36px 40px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.login-title {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: #222;
}

.login-subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
    font-size: 14px;
}

.error-message {
    background: #fff1f2;
    color: #dc3545;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 600;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 64px;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    color: #888;
    font-size: 18px;
    padding: 0;
}

.toggle-password:hover {
    color: #ff7a00;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #444;
}

.form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
}

.form-group input:focus {
    outline: none;
    border-color: #ff7a00;
}

.btn-login-submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #ff7a00;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}

.btn-login-submit:hover {
    background: #e86f00;
}

.register-link {
    margin-top: 22px;
    text-align: center;
    font-size: 14px;
    color: #666;
}

.forgot-link {
    margin-top: 14px;
    text-align: center;
    font-size: 14px;
}

.forgot-link a,
.register-link a {
    color: #ff7a00;
    text-decoration: none;
    font-weight: 700;
}



.success-message {
    background: #eafaf1;
    color: #198754;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 600;
}

</style>

</head>

<body>

<div th:replace="~{frontend/index/header :: header}"></div>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-title">
            會員登入
        </div>

        <div class="login-subtitle">
            歡迎來到台北GO了沒
        </div>

        <div th:if="${errorMsg}" class="error-message">
		    <span th:utext="${errorMsg}"></span>
		</div>
        
        <div th:if="${successMsg}" class="success-message">
		    <span th:text="${successMsg}"></span>
		</div>

        <form th:action="@{/auth/login}" method="post">

            <div class="form-group">
                <label>帳號</label>
                <input type="text"
				       id="custAccount"
				       name="custAccount"
				       placeholder="請輸入帳號">
            </div>

            <div class="form-group">
			    <label>密碼</label>
			
			    <div class="password-wrapper">
			        <input type="password"
			               id="custPassword"
			               name="custPassword"
			               placeholder="請輸入密碼">
			
			        <button type="button"
					        class="toggle-password"
					        onclick="togglePassword()">
					
					    <i id="toggleIcon" class="bi bi-eye"></i>
					
					</button>
			    </div>
			</div>
			
			<button type="submit" class="btn-login-submit">
			    登入
			</button>

            <button type="button"
			        class="btn-demo-login"
			        onclick="fillDemoAccount()">
			    Demo 帳號快速填入
			</button>
			<div style="text-align:center; margin-top:8px; color:#888; font-size:13px;">
			    展示專用，一鍵填入測試帳號與密碼
			</div>

        </form>

        <div class="forgot-link">
		    <a th:href="@{/auth/forgot-password}">
		        忘記密碼？
		    </a>
		</div>
		
		<div class="forgot-link" th:if="${showResendVerify}">
		    <a th:href="@{/auth/resend-verify}">
		        重新寄送驗證信
		    </a>
		</div>
		
		<div class="register-link">
		    還沒有帳號？
		    <a th:href="@{/auth/register}">
		        立即註冊
		    </a>
		</div>

    </div>

</div>

<div th:replace="~{frontend/index/footer :: footer}"></div>

<script>
function togglePassword() {

    const passwordInput = document.getElementById("custPassword");
    const icon = document.getElementById("toggleIcon");

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    } else {

        passwordInput.type = "password";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

}

function fillDemoAccount() {
    document.getElementById("custAccount").value = "ming123";
    document.getElementById("custPassword").value = "Aa123456";
}
</script>
</body>
</html>
