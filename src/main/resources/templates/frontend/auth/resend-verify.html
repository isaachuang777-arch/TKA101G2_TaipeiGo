<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>重新寄送驗證信</title>

<link rel="stylesheet" th:href="@{/css/index/header.css}">
<link rel="stylesheet" th:href="@{/css/index/footer.css}">

<style>
body {
    margin: 0;
    background: #f6f7fb;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

.wrapper {
    min-height: 620px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
}

.card {
    width: 420px;
    background: #fff;
    border-radius: 14px;
    padding: 36px 40px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.title {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 26px;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

.form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
}

.btn-submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #ff7a00;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.success-message {
    background: #eafaf1;
    color: #198754;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.6;
}

.back-link {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
}

.back-link a {
    color: #ff7a00;
    text-decoration: none;
    font-weight: 700;
}
</style>
</head>

<body>

<div th:replace="~{frontend/index/header :: header}"></div>

<div class="wrapper">
    <div class="card">

        <div class="title">重新寄送驗證信</div>

        <div class="subtitle">
            請輸入註冊時使用的電子信箱。<br>
            若帳號尚未完成驗證，系統將重新寄送驗證信。
        </div>

        <div th:if="${successMessage}" class="success-message">
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/auth/resend-verify}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="請輸入註冊 Email"
                       required>
            </div>

            <button type="submit" class="btn-submit">
                重新寄送驗證信
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/auth/login}">返回登入頁</a>
        </div>

    </div>
</div>

<div th:replace="~{frontend/index/footer :: footer}"></div>

</body>
</html>
