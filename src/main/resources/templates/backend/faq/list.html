<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>FAQ 管理 - TaipeiGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background: #f4f7fb;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

.card {
    border: none;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.card-header {
    background: #fff;
    border-bottom: 1px solid #e9ecef;
    padding: 18px 22px;
}

.table th {
    background: #f8fafc;
    color: #495057;   
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
}

.table td {
    vertical-align: middle;
    font-size: 15px;
}

.faq-title {
    font-weight: 600;
}

.content-preview {
    max-width: 420px;
    color: #64748b;
}

.badge-show {
    background: #e8f7ee;
    color: #198754;
}

.badge-hide {
    background: #f1f3f5;
    color: #6c757d;
}

.action-btn {
    text-decoration: none;
    margin: 0 4px;
    font-size: 18px;
}

.search-input {
    max-width: 260px;
}

@media (max-width: 768px) {
    .main-content {
        margin-left: 0;
        padding: 20px;
    }
}

:root {
    --primary: #0d6efd;
    --primary-dark: #0a58ca;
    --sidebar-width: 240px;
}

.main-content {
    margin-left: var(--sidebar-width);
    padding: 0;
}

.topbar {
    background: #fff;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 50;
    margin-bottom: 32px;
}

.topbar-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a2236;
}

.topbar-title span {
    color: #94a3b8;
    font-weight: 400;
    font-size: 0.85rem;
    margin-left: 8px;
}

.main-content > .stats-row,
.main-content > .card {
    margin-left: 32px;
    margin-right: 32px;
}

.stats-row {
    margin-bottom: 28px;
}

.stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid #e8edf2;
    height: 100%;
}

.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
}

.stat-icon.blue { background: #eff6ff; color: #3b82f6; }
.stat-icon.green { background: #f0fdf4; color: #22c55e; }
.stat-icon.orange { background: #fff7ed; color: #f97316; }

.stat-label {
    font-size: 0.78rem;
    color: #94a3b8;
    margin-bottom: 2px;
}

.stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e293b;
    line-height: 1;
}

.btn-add {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: background .2s;
}

.btn-add:hover {
    background: var(--primary-dark);
    color: #fff;
}
</style>
</head>

<body>

<div th:replace="~{backend/fragments/sidebar :: sidebar}"></div>

<div class="main-content">

    <header class="topbar">
	    <div class="topbar-title">
	        <i class="bi bi-question-circle me-2" style="color:var(--primary);"></i>
	        FAQ 管理
	        <span>/ FAQ 列表</span>
	    </div>
	
	    <a class="btn-add" th:href="@{/backend/faq/add}">
	        <i class="bi bi-plus-lg"></i>
	        新增 FAQ
	    </a>
	</header>
	
	<div class="row stats-row g-3">
    <div class="col-md-4">
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="bi bi-file-earmark-text-fill"></i>
            </div>
            <div>
                <div class="stat-label">總 FAQ 數</div>
                <div class="stat-value" th:text="${totalFaqCount}">0</div>
            </div>
        </div>
    </div>

    <div class="col-md-4">
	        <div class="stat-card">
	            <div class="stat-icon green">
	                <i class="bi bi-eye-fill"></i>
	            </div>
	            <div>
	                <div class="stat-label">顯示中</div>
	                <div class="stat-value" th:text="${showCount}">0</div>
	            </div>
	        </div>
	    </div>
	
	    <div class="col-md-4">
	        <div class="stat-card">
	            <div class="stat-icon orange">
	                <i class="bi bi-eye-slash-fill"></i>
	            </div>
	            <div>
	                <div class="stat-label">隱藏中</div>
	                <div class="stat-value" th:text="${hideCount}">0</div>
	            </div>
	        </div>
	    </div>
	</div>
	
	

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div class="fw-bold">
			    <i class="bi bi-list-ul me-1" style="color:var(--primary);"></i>
			    FAQ 列表
			    <span class="text-muted small ms-2" th:text="${'共 ' + totalItems + ' 筆'}"></span>
			</div>

            <form th:action="@{/backend/faq/list}"
			      method="get"
			      class="d-flex gap-2 flex-wrap align-items-center">
			
			    <input type="text"
			           name="keyword"
			           class="form-control form-control-sm"
			           style="width:220px;"
			           placeholder="搜尋標題 / 內容"
			           th:value="${keyword}">
			           
			    <select name="category"
				        class="form-select form-select-sm"
				        style="width:150px;">
				
				    <option value="">全部分類</option>
				
				    <option value="1"
				            th:selected="${category == 1}">
				        訂單與付款
				    </option>
				
				    <option value="2"
				            th:selected="${category == 2}">
				        票券使用
				    </option>
				
				    <option value="3"
				            th:selected="${category == 3}">
				        帳號與會員
				    </option>
				
				    <option value="4"
				            th:selected="${category == 4}">
				        活動與門票
				    </option>
				
				    <option value="5"
				            th:selected="${category == 5}">
				        其他
				    </option>
				
				</select>       
			
			    <select name="status"
			            class="form-select form-select-sm"
			            style="width:140px;">
			
			        <option value="">全部狀態</option>
			        <option value="1"
			                th:selected="${status == 1}">
			            顯示
			        </option>
			
			        <option value="0"
			                th:selected="${status == 0}">
			            隱藏
			        </option>
			
			    </select>
			
			    <button type="submit"
			            class="btn btn-primary btn-sm">
			        查詢
			    </button>

    <a th:href="@{/backend/faq/list}"
       class="btn btn-outline-secondary btn-sm">
        清除
    </a>

</form>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0" id="faqTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>分類</th>
                        <th>標題</th>
                        <th>內容摘要</th>
                        <th>狀態</th>
                        <th>最後異動時間</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:if="${faqList == null or faqList.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            目前沒有 FAQ 資料
                        </td>
                    </tr>

                    <tr th:each="faq, iterStat : ${faqList}">
                        <td th:text="${iterStat.index + 1}"></td>

                        <td th:switch="${faq.category}">
                            <span th:case="1" class="badge bg-primary-subtle text-primary">訂單與付款</span>
                            <span th:case="2" class="badge bg-success-subtle text-success">票券使用</span>
                            <span th:case="3" class="badge bg-warning-subtle text-warning">帳號與會員</span>
                            <span th:case="4" class="badge bg-info-subtle text-info">活動與門票</span>
                            <span th:case="5" class="badge bg-secondary-subtle text-secondary">其他</span>
                            <span th:case="*" class="badge bg-light text-dark">未分類</span>
                        </td>

                        <td class="faq-title" th:text="${faq.title}"></td>

                        <td class="content-preview"
                            th:text="${#strings.abbreviate(faq.content, 45)}"></td>

                        <td>
                            <span th:if="${faq.status == 1}" class="badge badge-show">
                                <i class="bi bi-circle-fill me-1" style="font-size:6px;"></i>
                                顯示
                            </span>

                            <span th:if="${faq.status == 0}" class="badge badge-hide">
                                <i class="bi bi-circle-fill me-1" style="font-size:6px;"></i>
                                隱藏
                            </span>
                        </td>

                        <td th:text="${#dates.format(faq.createTime, 'yyyy-MM-dd HH:mm')}"></td>

                        <td class="text-center">
                            <a class="action-btn text-warning"
                               th:href="@{/backend/faq/edit(faqId=${faq.faqId})}"
                               title="修改">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <a class="action-btn text-danger"
                               th:href="@{/backend/faq/delete(faqId=${faq.faqId})}"
                               onclick="return confirm('確定要刪除此 FAQ 嗎？')"
                               title="刪除">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
			
        </div>
        
        <div class="card-footer d-flex justify-content-between align-items-center">
    <div class="text-muted small">
        共 <span th:text="${totalItems}"></span> 筆資料，
        第 <span th:text="${currentPage + 1}"></span> 頁 /
        共 <span th:text="${totalPages}"></span> 頁
    </div>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination pagination-sm mb-0">

            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/backend/faq/list(page=${currentPage - 1}, keyword=${keyword}, category=${category}, status=${status})}">
                    上一頁
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/backend/faq/list(page=${i}, keyword=${keyword}, category=${category}, status=${status})}">
                </a>
            </li>

            <li class="page-item"
                th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/backend/faq/list(page=${currentPage + 1}, keyword=${keyword}, category=${category}, status=${status})}">
                    下一頁
                </a>
            </li>

        </ul>
    </nav>
</div>
    </div>
</div>

</body>
</html>
